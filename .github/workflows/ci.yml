name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Verify no sorry in source
        run: |
          if grep -rn "sorry" --include='*.lean' . ; then
            echo "::error::Found 'sorry' in Lean source"
            exit 1
          fi
          echo "No sorry found in Lean source."
